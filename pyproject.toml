[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathlens-osint"
version = "0.1.0"
description = "Evidence-first, passive cloud asset discovery for domains you are authorized to assess"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "dnspython>=2.6,<3",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
stix = ["stix2-matcher>=3,<4", "psutil>=7,<8"]

[project.scripts]
pathlens = "pathlens.cli:main"
pathlens-mcp = "pathlens.mcp_server:main"

[tool.setuptools.package-data]
pathlens = ["data/*.yaml", "dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

